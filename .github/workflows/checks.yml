# The tooling's own tests, and the validation in front of an amendment or a release pull request.
#
# The validation only reports.
# The required check is the `validate` commit status the ownership workflow posts, so no job may carry that name.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The examples job talks to real release hosts. It runs on its own clock,
    # not in front of a pull request.
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the authored half
        uses: actions/checkout@v7
        with:
          repository: KSAModding/content-index
          path: .authored

      - env:
          CONTENT_INDEX: ${{ github.workspace }}/.authored
        run: python3 -m unittest discover -s tools -t tools -v

  examples:
    name: examples
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Re-derives the design repository's hand-stamped examples/ from the real
      # release hosts and diffs.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/verify_examples.py --check-mirrors

  verdict:
    name: verdict

    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The head is a merge commit, so its first parent is the published version.
          fetch-depth: 2

      # A submitted release is derived against the listing it belongs to.
      - name: Check out the authored half
        uses: actions/checkout@v7
        with:
          repository: KSAModding/content-index
          path: .authored

      - name: Validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTENT_INDEX: ${{ github.workspace }}/.authored
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/validate.py \
            --pull-request "$PULL_REQUEST" \
            --repository "$REPOSITORY" \
            --output verdict.json

      - name: Leave a verdict even when a step failed
        if: failure() && hashFiles('verdict.json') == ''
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "verdict": "could-not-evaluate",' \
            '  "auto_merge_candidate": false,' \
            "  \"pull_request\": $PULL_REQUEST," \
            '  "head_sha": null,' \
            '  "documents": [],' \
            '  "scope_reason": "the validation job failed before it reached a verdict",' \
            '  "checks": []' \
            '}' > verdict.json

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-verdict
          path: verdict.json
          if-no-files-found: warn
          retention-days: 7
