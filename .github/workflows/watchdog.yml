# Report when GitHub has not started the watcher for a long time. A dropped
# scheduled run is otherwise silent, because nothing fails and only the run list
# shows it.
name: watchdog

on:
  schedule:
    # A gap is only seen at a sample, so fifteen minutes against the 45 below
    # keeps the longest invisible one under an hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: "Report when the watcher last started a successful scheduled run longer ago than this."
        required: false
        default: "45"
      dry_run:
        description: "Read everything, open and close nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # The key of the org App is a secret of this environment, which only main may use.
    environment: index-bot
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The same identity the watcher runs as, so the gap is reported by the
      # bot that keeps the other index issues rather than by github-actions.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.INDEX_APP_ID }}
          private-key: ${{ secrets.INDEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: content-index-releases

      - uses: actions/checkout@v7

      - name: Check when the watcher last started a successful scheduled run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_MINUTES: ${{ inputs.stale_minutes || '45' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          arguments=(
            --repository "$REPOSITORY"
            --stale-minutes "$STALE_MINUTES"
          )
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--dry-run)
          fi

          python3 tools/watchdog.py "${arguments[@]}"
