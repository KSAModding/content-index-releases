# Report a master server that has not answered several game versions polls in
# a row, which is silent because that poll stays green. Started by hand, it also
# reports when GitHub has not started the watcher for a long time.
name: watchdog

on:
  # The watcher starts this run every 3 hours (tools/dispatch_due.py). A run the
  # watcher starts always finds a fresh tick, so that run does not check the
  # watcher's schedule.
  repository_dispatch:
    types: [due-watchdog]
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: "Report when the watcher last started a successful scheduled run longer ago than this."
        required: false
        default: "180"
      unanswered_polls:
        description: "Report when this many polls of the master server in a row got no answer."
        required: false
        default: "3"
      dry_run:
        description: "Read everything, open and close nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    name: check
    # A fixed image, so a change of the latest label does not change the job.
    runs-on: ubuntu-24.04
    # The key of the org App is a secret of this environment, which only main may use.
    environment: index-bot
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The same identity the watcher runs as, so the gap is reported by the
      # bot that keeps the other index issues rather than by github-actions.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.INDEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.INDEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: content-index-releases

      - uses: actions/checkout@v7

      - name: Check when the watcher last started a successful scheduled run
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_MINUTES: ${{ inputs.stale_minutes || '180' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          arguments=(
            --repository "$REPOSITORY"
            --stale-minutes "$STALE_MINUTES"
          )
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--dry-run)
          fi

          python3 tools/watchdog.py "${arguments[@]}"

      # An unanswered poll of the game versions workflow ends green, so this
      # reads which of its runs got an answer. A poll fails now and then, so only
      # several in a row are reported. This counts polls and not time, because
      # the polls come only with the watcher's ticks. A poll by the clock is a
      # run the watcher started, and a build added by hand is no poll.
      - name: Check when the master server last answered a poll
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          UNANSWERED_POLLS: ${{ inputs.unanswered_polls || '3' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          arguments=(
            --repository "$REPOSITORY"
            --workflow game-versions.yml
            --event repository_dispatch
            --unanswered-step "Master server did not answer"
            --unanswered-polls "$UNANSWERED_POLLS"
          )
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--dry-run)
          fi

          python3 tools/watchdog.py "${arguments[@]}"
