# Merge both halves of the index into the one document clients fetch, and publish
# it at /v1/index.json, the fetch contract of RFC 0033.
name: snapshot

on:
  push:
    branches: [main]
    paths:
      - releases/**
      - game-versions.json
      - tools/build_snapshot.py
      - tools/stamp_release.py
      - .github/workflows/snapshot.yml
  repository_dispatch:
    types: [index-changed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  PUBLISHED: https://ksamodding.github.io/content-index-releases/v1/index.json

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/content-index
          ref: main
          path: .authored

      - name: Fetch the published snapshot
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
            "$PUBLISHED" -o published.json || rm -f published.json

      - name: Build
        run: |
          set -euo pipefail
          python3 tools/build_snapshot.py \
            --authored .authored \
            --previous published.json \
            --out _site/v1/index.json \
            --authored-repo "${{ github.repository_owner }}/content-index" \
            --authored-commit "$(git -C .authored rev-parse HEAD)" \
            --generated-repo "${{ github.repository }}" \
            --generated-commit "$(git rev-parse HEAD)"

      - name: Compare against what is published
        id: compare
        run: |
          set -euo pipefail
          if [ -f published.json ] && cmp -s published.json _site/v1/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "the published snapshot is already current, so nothing is deployed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages serves the strong ETag and answers If-None-Match
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
