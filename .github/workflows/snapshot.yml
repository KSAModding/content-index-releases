# Merge both halves of the index into the documents clients fetch, and publish
# them under /v1/: index.json, the fetch contract of RFC 0033, and next to it the
# file of each type that is not in it, which tools/build_snapshot.py names.
name: snapshot

on:
  push:
    branches: [main]
    paths:
      - releases/**
      - game-versions.json
      - download-counts.json
      - tools/build_snapshot.py
      - tools/authored.py
      - tools/stamp_release.py
      - .github/workflows/snapshot.yml
  repository_dispatch:
    types: [index-changed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  PUBLISHED: https://ksamodding.github.io/content-index-releases/v1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/content-index
          ref: main
          path: .authored
          # listed_at (RFC 0092) is read from the full first-parent history of main.
          fetch-depth: 0

      # A file that answers 404 is not published. Any other failure leaves open
      # whether it is, and a type file left out of a deployment would go away, so
      # the run stops and the next one tries again.
      - name: Fetch the published snapshot
        run: |
          set -euo pipefail
          mkdir -p published/v1
          names=$(python3 tools/build_snapshot.py --published-files)
          for name in $names; do
            code=$(curl -sS --max-time 30 --retry 3 -H 'Cache-Control: no-cache' -w '%{http_code}' \
              "$PUBLISHED/$name" -o "published/v1/$name") || code=000
            if [ "$code" = 404 ]; then
              rm -f "published/v1/$name"
            elif [ "$code" != 200 ]; then
              echo "::error::$PUBLISHED/$name answered $code, so it is not known whether it is published"
              exit 1
            fi
          done

      - name: Build
        run: |
          set -euo pipefail
          python3 tools/build_snapshot.py \
            --authored .authored \
            --previous published/v1/index.json \
            --out _site/v1/index.json \
            --authored-repo "${{ github.repository_owner }}/content-index" \
            --authored-commit "$(git -C .authored rev-parse HEAD)" \
            --generated-repo "${{ github.repository }}" \
            --generated-commit "$(git rev-parse HEAD)"

      - name: Compare against what is published
        id: compare
        run: |
          set -euo pipefail
          # A deployment replaces the whole site, so one changed file deploys every file.
          if diff -rq published/v1 _site/v1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "the published snapshot is already current, so nothing is deployed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages serves the strong ETag and answers If-None-Match
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
