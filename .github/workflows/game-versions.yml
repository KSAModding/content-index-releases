# Poll the master server for the current production build and append it to
# game-versions.json.
name: game versions

on:
  # The watcher starts the hourly poll, because a schedule entry of its own
  # would take ticks from the watcher (tools/dispatch_due.py).
  repository_dispatch:
    types: [due-game-versions]
  workflow_dispatch:
    inputs:
      build:
        description: "A production build to add by hand, for example when the master server does not answer"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: game-versions
  cancel-in-progress: false

jobs:
  update:
    name: update
    # A fixed image, so a change of the latest label does not change the job.
    runs-on: ubuntu-24.04
    # The key of the org App is a secret of this environment, which only main may use.
    environment: index-bot
    steps:
      # Only the org App may write to the default branch unattended.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.INDEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.INDEX_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Always the tip of main. An old checkout would append to an outdated
          # list and fail to push, and this keeps a re-run idempotent.
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Poll the master server
        id: poll
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD" ]; then
            response="$(jq -n --arg version "$BUILD" '{Version: $version}')"
          else
            response="$(curl -fsS --max-time 30 --retry 3 --retry-delay 5 \
              http://ksa-master1.rocketwerkz.com:8082/version || true)"
          fi
          if [ -z "$response" ]; then
            echo "master server unreachable, nothing to do this run"
            echo "added=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "answered=true" >> "$GITHUB_OUTPUT"
          echo "version response: $response"
          added="$(python3 tools/update_game_versions.py "$response")"
          echo "added=$added" >> "$GITHUB_OUTPUT"
          if [ -n "$BUILD" ] && [ -z "$added" ]; then
            echo "::warning title=No build added::The build given by hand was not added, and the line above says why."
          fi

      # An unanswered poll stays a green run, so this step is what tells it apart.
      # tools/watchdog.py reads it off the run: skipped means the server answered.
      # Keep its name in step with the --unanswered-step of the last step.
      - name: Master server did not answer
        if: steps.poll.outputs.answered != 'true'
        run: echo "::warning title=Master server did not answer::The poll got no answer, so no build was added this run."

      - name: Commit
        if: steps.poll.outputs.added != ''
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add game-versions.json
          git commit -m "Add game build ${{ steps.poll.outputs.added }}"
          # The watcher starts this run together with others that push their own
          # files, so a rejected push rebases and never conflicts.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo "could not push after three attempts; the next poll adds the build again"
          exit 1

      # A run that ended green says nothing about the master server, so this
      # reads which of the earlier polls got an answer. A poll fails now and
      # then, so only several in a row open the issue. It reads only the polls
      # the watcher started, because a build added by hand is no poll, and only
      # runs that have ended, so this run counts from the next poll on.
      - name: Check when the master server last answered a poll
        if: ${{ !cancelled() && github.event_name == 'repository_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          arguments=(
            --repository "$REPOSITORY"
            --workflow game-versions.yml
            --event repository_dispatch
            --unanswered-step "Master server did not answer"
            --unanswered-polls 3
          )
          python3 tools/watchdog.py "${arguments[@]}"
